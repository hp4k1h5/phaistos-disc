name: release
on:
  workflow_run:
    workflows: ["build,lint,test"]
    types:
      - completed
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN}}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo UV_PUBLISH_TOKEN $UV_PUBLISH_TOKEN
