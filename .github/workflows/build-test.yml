name: build,lint,test
on:
  push: "*"
  tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install and configure uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.8.0
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: set up python
        run: uv python install

      - name: uv sync
        run: uv sync

      - name: ruff,ty
        run: | 
          uv run ruff check
          uvx ty check --exit-zero

      - name: pytest
        run: |
          uv run pytest

