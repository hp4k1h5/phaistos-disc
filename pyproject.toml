[project]
name = "phaistos-disc"
version = "0.1.0"
description = "Python library to aid in the decipherment of the Phaistos Disc"
readme = "README.md"
authors = [{ name = "bob", email = "robertwalks@gmail.com" }]
requires-python = ">=3.12"

dependencies = [
    "polars>=1.31.0",
]

[dependency-groups]
extras = [
    "cltk>=1.3.0",
]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
    "ty>=0.0.1a15",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79
